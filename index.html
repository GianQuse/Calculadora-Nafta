<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Viewport + notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Color barra navegador -->
    <meta name="theme-color" content="#1e1e2f">

    <!-- Soporte modo app iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="imagen/Icon.jpeg">

    <title>Calculadora de Combustible</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="imagen/fvicon.png">
</head>

<body>

    <div class="container">
        <h1>⛽ Calculadora de Combustible</h1>

        <div class="form">

            <div class="campo">
                <label for="kmDia">KM por día</label>
                <input type="number" id="kmDia" value="34" readonly>
            </div>

            <div class="campo">
                <label for="dias">Días viajados</label>
                <input type="number" id="dias">
            </div>

            <div class="campo">
                <label for="rendimiento">KM por litro</label>
                <input type="number" id="rendimiento" value="13" readonly>
            </div>

            <div class="campo">
                <label for="precio">Precio combustible ($)</label>
                <input type="number" id="precio">
            </div>

            <button onclick="calcular()" class="btn-calcular">Calcular costo</button>
            <button onclick="borrarCampos()" class="btn-borrar">Borrar</button>
        </div>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
