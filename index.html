<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e2f">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calculadora de Combustible</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="top-bg"></div>

    <div class="container">
        <h1>⛽ Calculadora de Combustible</h1>

        <div class="form">

            <div class="campo">
                <label for="kmDia">KM por día</label>
                <input type="number" id="kmDia" value="34" readonly>
            </div>

            <div class="campo">
                <label for="dias">Días viajados</label>
                <input type="number" id="dias">
            </div>

            <div class="campo">
                <label for="rendimiento">KM por litro</label>
                <input type="number" id="rendimiento" value="13" readonly>
            </div>

            <div class="campo">
                <label for="precio">Precio combustible ($)</label>
                <input type="number" id="precio">
            </div>

            <button onclick="calcular()">Calcular costo</button>
        </div>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
